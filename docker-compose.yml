version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: chef-sys-db
    restart: always
    environment:
      POSTGRES_USER: chefuser
      POSTGRES_PASSWORD: chefpass
      POSTGRES_DB: chefsysdb
    ports:
      - "5432:5432"
    volumes:
      - chef_sys_data:/var/lib/postgresql/data

volumes:
  chef_sys_data:
